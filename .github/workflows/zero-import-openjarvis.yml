name: Import OpenJarvis source

on:
  push:
    branches:
      - openjarvis-import
    paths:
      - .github/workflows/zero-import-openjarvis.yml

permissions:
  contents: write

concurrency:
  group: openjarvis-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: openjarvis-import
          fetch-depth: 0
          persist-credentials: true

      - name: Download and unpack OpenJarvis
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/open-jarvis/OpenJarvis/archive/refs/heads/main.zip \
            -o /tmp/openjarvis.zip
          mkdir -p /tmp/openjarvis
          unzip -q /tmp/openjarvis.zip -d /tmp/openjarvis
          SOURCE_DIR="$(find /tmp/openjarvis -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SOURCE_DIR"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$SOURCE_DIR"/. .
          rm -f .github/workflows/zero-import-openjarvis.yml
          if [ -d .github/workflows ]; then
            mkdir -p .github/workflows-disabled
            cp -a .github/workflows/. .github/workflows-disabled/
            rm -rf .github/workflows
          fi

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Replace ZERO source with OpenJarvis"
          git push origin HEAD:openjarvis-import
