name: Build ZERO APK
on:
  push:
    branches:
      - feat/zero-jarvis-interface
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Tingnan kung kumpleto ang mga file
        run: |
          ls -la
          for f in index.html patch_manifest.py MainActivity.java ZeroPlugin.java ZeroService.java; do
            test -f "$f" || { echo "WALA ang $f sa root ng repo" | tee -a log-native.txt; exit 1; }
          done
      - name: Gawin ang Capacitor project
        run: |
          mkdir apk && cd apk
          npm init -y
          npm install --legacy-peer-deps @capacitor/core@5.7 @capacitor/cli@5.7 @capacitor/android@5.7 @capacitor/app-launcher@5 @capacitor/geolocation@5 @capacitor/local-notifications@5 @capacitor-community/speech-recognition@5 @capacitor-community/text-to-speech@5
          mkdir www
          cp ../index.html www/index.html
          echo '{"appId":"com.zero.assistant","appName":"ZERO","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
      - name: Build A - ALWAYS-ON (may native background service)
        id: nat
        continue-on-error: true
        run: |
          LOG=$GITHUB_WORKSPACE/log-native.txt
          cd apk
          (
            npx cap add android
            npx cap sync android
            python3 ../patch_manifest.py android/app/src/main/AndroidManifest.xml
            D=android/app/src/main/java/com/zero/assistant
            ls $D
            cp ../MainActivity.java ../ZeroPlugin.java ../ZeroService.java $D/
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          ) 2>&1 | tee $LOG
      - name: Build B - SAFE (fallback kapag nag-fail ang A)
        id: safe
        if: steps.nat.outcome != 'success'
        run: |
          LOG=$GITHUB_WORKSPACE/log-safe.txt
          cd apk
          rm -rf android
          (
            npx cap add android
            npx cap sync android
            MF=android/app/src/main/AndroidManifest.xml
            sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent><intent><action android:name="android.speech.RecognitionService"/></intent></queries><application#' $MF
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          ) 2>&1 | tee $LOG
      - name: Ipakita kung bakit nag-fail ang ALWAYS-ON build
        if: steps.nat.outcome != 'success'
        run: |
          echo '### Nag-fail ang ALWAYS-ON build (A). Ito ang error nito:' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          (grep -n -E "error:|What went wrong|FAILED|Exception" log-native.txt | head -25; echo ----; tail -n 25 log-native.txt) >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo 'Ang SAFE na APK (B) ang ginawa; wala itong background service.' >> $GITHUB_STEP_SUMMARY
      - name: Ipakita ang error kung pati SAFE ay nag-fail
        if: failure()
        run: |
          echo '### Nag-fail ang build. Huling bahagi ng log:' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          (tail -n 60 log-safe.txt 2>/dev/null || tail -n 60 log-native.txt) >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: steps.nat.outcome == 'success'
        with:
          name: ZERO-apk-ALWAYS-ON
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: steps.nat.outcome != 'success' && steps.safe.outcome == 'success'
        with:
          name: ZERO-apk-SAFE
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
