name: Build ZERO APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Gawin ang Android project
        run: |
          mkdir apk && cd apk
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/app-launcher@5 @capacitor/geolocation@5 @capacitor/local-notifications@5 @capacitor-community/speech-recognition@5
          mkdir www && cp ../index.html www/index.html
          echo '{"appId":"com.zero.assistant","appName":"ZERO","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' $MF
      - name: I-build ang APK
        run: cd apk/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZERO-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
