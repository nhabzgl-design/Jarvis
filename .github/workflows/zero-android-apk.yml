name: Build ZERO Android APK

on:
  push:
    branches:
      - android-mobile-port
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout ZERO
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Pin npm version
        run: npm install --global npm@11.19.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build ZERO APK
        working-directory: frontend
        run: npm run android:build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-Android-arm64-APK
          path: frontend/src-tauri/gen/android/**/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14
