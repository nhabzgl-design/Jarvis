[package]
name = "openjarvis-desktop"
version = "1.0.1"
description = "OpenJarvis desktop and Android application"
edition = "2021"
license = "MIT"

[lib]
name = "openjarvis_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The Android shell uses only Tauri itself. Desktop-only plugins and process
# dependencies are intentionally excluded from the Android target.
[target.'cfg(target_os = "android")'.dependencies]
tauri = "2"
serde_json = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
toml_edit = "0.25"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }

# Desktop OS credential stores only; these are not part of the Android build.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
dispatch = "0.2"
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
