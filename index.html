<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14141a">
<title>ZERO</title>
<style>
:root{--ink:#d8f3ff;--dim:#8aa0b0;--cy:#3fb6ff;--or:#ff9a2e;--panel:#14161d;--line:#2a3a4a;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0e12;color:var(--ink);font-family:system-ui,"Segoe UI",sans-serif;overflow:hidden}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#name{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;font-weight:700;letter-spacing:.35em;font-size:14px;color:var(--cy);pointer-events:none}
#sub{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);text-align:center;font-size:19px;font-weight:600;line-height:1.35;text-shadow:0 2px 12px #000;min-height:52px;max-height:26vh;overflow:hidden}
#heard{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);text-align:center;font-size:12px;color:var(--dim);height:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;justify-content:center;gap:14px}
.b{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;font-weight:700;display:grid;place-items:center;cursor:pointer}
.b:focus-visible{outline:2px solid var(--cy)}
#mic{width:68px;height:68px;margin-top:-6px;border-color:var(--cy);box-shadow:0 0 22px #3fb6ff55}
#mic.on{background:var(--or);border-color:var(--or);color:#210e00;box-shadow:0 0 30px #ff9a2e99}
#set{position:fixed;inset:0;background:#0d0e12f2;display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 30px}
#set.open{display:block}
#set h2{margin:0 0 4px;font-size:18px}
#set p{margin:0 0 14px;color:var(--dim);font-size:13px;line-height:1.45}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:15px}
.row{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.btn{margin-top:18px;padding:13px 18px;border-radius:8px;border:0;background:var(--cy);color:#00202e;font-weight:700;font-size:15px;width:100%}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="name">ZERO</div>
<div id="sub"></div>
<div id="heard"></div>
<div id="bar">
  <button class="b" id="lang" aria-label="Wika">TL</button>
  <button class="b" id="mic" aria-label="Mic">MIC</button>
  <button class="b" id="gear" aria-label="Settings">SET</button>
</div>
<div id="set">
  <h2>Setup ni Zero</h2>
  <p>Nasa server (Render) ang Gemini at ElevenLabs key. Dito, URL ng server at password lang.</p>
  <label>Server URL (iwanang blangko kung dito mismo naka-host)</label>
  <input type="text" id="ku" autocomplete="off" placeholder="https://jarvis-ai-9drf.onrender.com">
  <label>APP_PASSWORD</label>
  <input type="password" id="kp" autocomplete="off">
  <div class="row"><input type="checkbox" id="kw"><span>Sumagot lang kapag tinawag na "Zero"</span></div>
  <button class="btn" id="save">I-save at isara</button>
</div>

function api(path,body){
  return fetch(base()+path,{method:"POST",headers:{"Content-Type":"application/json","x-app-password":cfg.pw},body:JSON.stringify(body)});

var actx=null,analyser=null;
function ensureAudio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==="suspended")actx.resume();
}
function meter(){
  if(!analyser||!speaking)return;
  var d=new Uint8Array(analyser.frequencyBinCount),s=0,i;analyser.getByteFrequencyData(d);
  for(i=0;i<d.length;i++)s+=d[i];
  amp=Math.min(1,s/d.length/90);requestAnimationFrame(meter);
}
function speak(text){
  return new Promise(function(done){
    speaking=true;
    status("nagsasalita");
    sub(text);
    amp=0.4;

    var finished=false;

    var fin=function(){
      if(finished)return;
      finished=true;
      speaking=false;
      amp=0;
      status(listening?"nakikinig":"handa");
      done();
    };

    try{
      if(!("speechSynthesis" in window) ||
         !("SpeechSynthesisUtterance" in window)){
        sub("Hindi available ang Android Text-to-Speech.");
        fin();
        return;
      }

      var u=new SpeechSynthesisUtterance(text);
      u.lang=cfg.l==="tl"?"fil-PH":"en-US";

      var voices=speechSynthesis.getVoices();
      var preferred=voices.find(function(v){
        return v.default;
      });

      if(preferred)u.voice=preferred;

      var iv=setInterval(function(){
        if(!speaking){
          clearInterval(iv);
          return;
        }
        amp=0.3+Math.random()*0.5;
      },90);

      u.onend=function(){
        clearInterval(iv);
        fin();
      };

      u.onerror=function(){
        clearInterval(iv);
        fin();
      };

      speechSynthesis.cancel();
      speechSynthesis.speak(u);

    }catch(e){
      fin();
    }
  });
}
    ensureAudio();
    api("/api/tts",{text:text}).then(function(r){if(!r.ok)throw new Error("tts "+r.status);return r.blob();})
    .then(function(b){
      var a=new Audio(URL.createObjectURL(b));
      try{if(actx){var src=actx.createMediaElementSource(a);analyser=actx.createAnalyser();analyser.fftSize=256;src.connect(analyser);analyser.connect(actx.destination);}}catch(e){analyser=null;}

      a.play().then(function(){if(analyser)meter();else{var iv=setInterval(function(){if(!speaking)clearInterval(iv);amp=0.3+Math.random()*0.5;},90);}}).catch(fallback);
    }).catch(fallback);
  });
}

var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null;
function lang(){return cfg.l==="tl"?"fil-PH":"en-US";}
function startNative(SRN){
  SRN.requestPermissions().then(function(){
    if(SRN.removeAllListeners)SRN.removeAllListeners();
    var last="",tm=null;
    function finish(){
      var tx=last;last="";
      try{SRN.stop();}catch(e){}
      if(tx&&!busy&&!speaking)handle(tx);
      else if(listening)setTimeout(function(){startRec();},400);
    }
    SRN.addListener("partialResults",function(d){
      var m=(d.matches||[])[0];if(!m)return;
      last=m;heard(m);clearTimeout(tm);tm=setTimeout(finish,1400);
    });
    status("nakikinig");
    SRN.start({language:lang(),maxResults:1,partialResults:true,popup:false}).catch(function(){
      if(listening)setTimeout(function(){startRec();},1200);
    });
  }).catch(function(){sub("Payagan ang microphone permission.");});
}
function startRec(){
  var SRN=plug("SpeechRecognition");
  if(SRN){startNative(SRN);return;}
  if(!SR){sub("Walang speech recognition ang browser. Gamitin ang Chrome o ang APK.");return;}
  if(rec){try{rec.onend=null;rec.abort();}catch(e){}}
  rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang=lang();
  rec.onresult=function(ev){
    var r=ev.results[ev.results.length-1],txt=r[0].transcript.trim();
    heard(txt);if(r.isFinal&&txt&&!busy&&!speaking)handle(txt);
  };
  rec.onerror=function(ev){if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){listening=false;setMic();sub("Payagan ang microphone sa browser.");}};
  rec.onend=function(){if(listening&&!speaking&&!busy)setTimeout(function(){if(listening&&!speaking&&!busy)startRec();},250);};
  try{rec.start();status("nakikinig");}catch(e){}
}
function stopRec(){
  var SRN=plug("SpeechRecognition");if(SRN){try{SRN.stop();}catch(e){}}

}

  var AL=plug("AppLauncher");
  if(AL){AL.openUrl({url:u}).catch(function(){try{window.open(u,"_blank");}catch(e){}});return;}
  var w=null;try{w=window.open(u,"_blank");}catch(e){}if(!w)location.href=u;
}
var alarms=[];
setInterval(function(){
  var d=new Date(),hm=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2),i;
  for(i=alarms.length-1;i>=0;i--)if(alarms[i].t===hm){var a=alarms.splice(i,1)[0];ring("Alarm: "+(a.l||hm));}
},10000);
function notifyAt(when,title){
  var LN=plug("LocalNotifications");if(!LN)return;
  LN.requestPermissions().then(function(){LN.schedule({notifications:[{id:Math.floor(Math.random()*2e9),title:"ZERO",body:title,schedule:{at:when,allowWhileIdle:true}}]});}).catch(function(){});
}
function ring(msg){
  try{if(navigator.vibrate)navigator.vibrate([400,200,400,200,400]);}catch(e){}
  stopRec();busy=true;speak(msg+". Boss!").then(function(){busy=false;if(listening)startRec();});
}
function act(a){
  return new Promise(function(res){
    if(!a||!a.type){res("");return;}
    var q=encodeURIComponent(a.q||"");
    switch(a.type){
      case "google":go("https://www.google.com/search?q="+q);res("");break;
      case "youtube":go("https://www.youtube.com/results?search_query="+q);res("");break;
      case "facebook":go("https://www.facebook.com/search/top?q="+q);res("");break;
      case "maps":go("https://www.google.com/maps/search/?api=1&query="+q);res("");break;
      case "app":go(APPS[a.name]||"https://www.google.com");res("");break;
      case "call":go("tel:"+String(a.number||"").replace(/[^\d+]/g,""));res("");break;
      case "sms":go("sms:"+String(a.number||"").replace(/[^\d+]/g,"")+"?body="+encodeURIComponent(a.body||""));res("");break;
      case "time":{var d=new Date();res("Ang oras ngayon ay "+d.toLocaleTimeString("fil-PH",{hour:"numeric",minute:"2-digit"})+", "+d.toLocaleDateString("fil-PH",{weekday:"long",month:"long",day:"numeric"})+".");break;}
      case "location":
        if(!navigator.geolocation){res("Hindi ko ma-access ang location.");break;}
        navigator.geolocation.getCurrentPosition(function(p){
          var la=p.coords.latitude.toFixed(5),lo=p.coords.longitude.toFixed(5);
          go("https://www.google.com/maps/search/?api=1&query="+la+","+lo);
          res("Nandito ka sa latitude "+la+", longitude "+lo+". Binuksan ko ang mapa.");
        },function(){res("Hindi ko makuha ang location. Payagan ang location permission.");},{enableHighAccuracy:true,timeout:12000});
        break;
      case "timer":{var s=Math.max(1,Math.round(+a.seconds||60));
        setTimeout(function(){ring("Tapos na ang timer"+(a.label?" para sa "+a.label:""));},s*1000);
        notifyAt(new Date(Date.now()+s*1000),"Timer: "+(a.label||""));res("");break;}
      case "alarm":{var m=/^(\d{1,2}):(\d{2})$/.exec(a.time||"");
        if(m){alarms.push({t:("0"+m[1]).slice(-2)+":"+m[2],l:a.label});
          var at=new Date();at.setHours(+m[1],+m[2],0,0);if(at<new Date())at.setDate(at.getDate()+1);notifyAt(at,"Alarm: "+(a.label||a.time));res("");}
        else res("Hindi ko naintindihan ang oras ng alarm.");break;}
      default:res("");
    }
  });
}

/* ================= main turn ================= */
function handle(text){
  if(cfg.w){
    var ix=text.toLowerCase().search(/\b(zero|ziro|sero)\b/);
    if(ix<0){if(listening)setTimeout(function(){startRec();},300);return;}
    text=text.slice(ix).replace(/^\S+[\s,]*/,"").trim();
    if(!text){speak("Opo boss?");return;}
  }
  busy=true;status("nag-iisip");stopRec();
  ask(text).then(function(o){
    return act(o.action).then(function(extra){return speak((o.say||"")+(extra?" "+extra:""));});
  }).catch(function(e){return speak((e&&e.message)?e.message:"May problema sa koneksyon, boss.");})
  .then(function(){busy=false;heard("");if(listening)startRec();});
}

/* ================= settings ================= */
$("gear").onclick=function(){$("ku").value=cfg.base;$("kp").value=cfg.pw;$("kw").checked=cfg.w;$("set").classList.add("open");};
$("save").onclick=function(){
  cfg.base=$("ku").value.trim();cfg.pw=$("kp").value;cfg.w=$("kw").checked;saveCfg();
  $("set").classList.remove("open");sub("Handa na si Zero. Pindutin ang MIC at magsalita.");
};
setTimeout(function(){
  sub("Pindutin ang MIC para makinig si Zero.");
  fetch(base()+"/api/ping",{headers:{"x-app-password":cfg.pw}}).then(function(r){if(r.status===401)sub("Ilagay ang APP_PASSWORD sa SET.");}).catch(function(){sub("Hindi maabot ang server. Tingnan ang Server URL sa SET.");});
},3800);
})();
</script>
